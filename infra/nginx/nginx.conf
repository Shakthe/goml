# Gateway: serves the static frontend (CDN stand-in), rate-limits per client IP,
# blocks obvious bots and load-balances API calls across all API replicas.
worker_processes auto;
worker_rlimit_nofile 65535;
events { worker_connections 16384; multi_accept on; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 30s;
  keepalive_requests 10000;
  server_tokens off;
  access_log    off;   # 100k requests in 10 s; counters live in the API and k6 instead

  gzip on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # In production the client IP comes from the CDN / cloud load balancer in front of us.
  # Locally we trust the Docker network, which lets the load test simulate many clients.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header   X-Forwarded-For;

  # Rate limits. A real buyer clicks once; anything faster than this is a script.
  limit_req_zone  $binary_remote_addr zone=checkout:20m rate=2r/s;
  limit_req_zone  $binary_remote_addr zone=api:20m      rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=perip:20m;
  limit_req_status  429;
  limit_conn_status 429;

  # Empty user agents and common scraping libraries are refused at the edge.
  map $http_user_agent $bad_bot {
    default 0;
    ""      1;
    ~*(python-requests|scrapy|aiohttp|go-http-client|httpx|libwww-perl|headlesschrome) 1;
  }

  upstream api_pool {
    # Docker DNS returns every API replica for "api"; nginx round-robins across them.
    server api:3000 max_fails=0;
    keepalive 512;
  }

  server {
    listen 80;
    root /usr/share/nginx/html;

    location = /api/checkout {
      default_type application/json;
      if ($bad_bot) { return 403 '{"code":"BLOCKED","message":"Automated traffic is not allowed."}'; }
      limit_req  zone=checkout burst=5 nodelay;
      limit_conn perip 20;
      proxy_pass http://api_pool;
      include /etc/nginx/proxy_common.conf;
      proxy_read_timeout 15s;
    }

    location = /api/sale/stream {
      proxy_pass http://api_pool;
      include /etc/nginx/proxy_common.conf;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api_pool;
      include /etc/nginx/proxy_common.conf;
      proxy_read_timeout 15s;
    }

    # Hashed build assets never change, so browsers and CDNs can keep them for a year.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
